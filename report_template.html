<title>Siege Record</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a siege "war room" ledger. Dark stone header band with a battlement edge, then the score
   tiles, filters, pill tabs and tables. Bronze is the accent; gold, silver and bronze are kept for the podium. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --line: #dbe1e7; --ink: #18212b; --ink-2: #4c5866; --ink-3: #7b8794;
  --accent: #9a5b22; --accent-soft: #f5eadf;
  --win: #16907f; --loss: #c2463d; --win-soft: #dff2ee; --loss-soft: #f8e2df;
  --band-bg: #1d242c; --band-bg-2: #2a333d; --band-ink: #f4efe7; --band-ink-2: #b7c0c9; --band-chip: rgb(255 255 255 / .08);
  --shadow: 0 1px 2px rgb(18 28 40 / .05), 0 6px 18px rgb(18 28 40 / .06);
  --shadow-up: 0 2px 4px rgb(18 28 40 / .06), 0 12px 28px rgb(18 28 40 / .10);
  --gold-edge: #8a5f0c; --silver-edge: #66727e; --bronze-edge: #7a4219; --crown-ink: #2b2210;
  --gold-tint: rgb(214 160 30 / .10); --silver-tint: rgb(130 145 160 / .10); --bronze-tint: rgb(176 104 48 / .10);
  --gold-glow: rgb(240 190 60 / .55);
  --f-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161b; --panel: #1b2027; --line: #2b333d; --ink: #e8ecf0; --ink-2: #b0bac5; --ink-3: #808b97;
  --accent: #d9954f; --accent-soft: #33281d;
  --win: #2fa896; --loss: #de6a5f; --win-soft: #16322d; --loss-soft: #3a201f;
  --band-bg: #0b0e12; --band-bg-2: #171c23; --band-ink: #f4efe7; --band-ink-2: #a9b3bd; --band-chip: rgb(255 255 255 / .07);
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  --shadow-up: 0 2px 4px rgb(0 0 0 / .35), 0 12px 28px rgb(0 0 0 / .4);
  --gold-tint: rgb(224 179 65 / .09); --silver-tint: rgb(170 182 194 / .08); --bronze-tint: rgb(208 138 82 / .09);
  --gold-glow: rgb(240 190 60 / .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161b; --panel: #1b2027; --line: #2b333d; --ink: #e8ecf0; --ink-2: #b0bac5; --ink-3: #808b97;
  --accent: #d9954f; --accent-soft: #33281d;
  --win: #2fa896; --loss: #de6a5f; --win-soft: #16322d; --loss-soft: #3a201f;
  --band-bg: #0b0e12; --band-bg-2: #171c23; --band-ink: #f4efe7; --band-ink-2: #a9b3bd; --band-chip: rgb(255 255 255 / .07);
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  --shadow-up: 0 2px 4px rgb(0 0 0 / .35), 0 12px 28px rgb(0 0 0 / .4);
  --gold-tint: rgb(224 179 65 / .09); --silver-tint: rgb(170 182 194 / .08); --bronze-tint: rgb(208 138 82 / .09);
  --gold-glow: rgb(240 190 60 / .45); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.inner { max-width: 1180px; margin: 0 auto }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.meta { color: var(--ink-3); font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Header band with a battlement edge */
.band { position: relative; background: linear-gradient(160deg, var(--band-bg-2), var(--band-bg) 60%); color: var(--band-ink); padding-block: 30px 34px; margin-bottom: 14px }
.band::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px;
  background: linear-gradient(90deg, var(--band-bg) 0 50%, transparent 50% 100%) 0 0 / 40px 100% repeat-x }
.eyebrow { font: 600 12px var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px }
h1 { font: 800 clamp(28px, 5vw, 46px)/1.05 var(--f-display); letter-spacing: .02em; margin: 0; text-wrap: balance }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px }
.chips span { font-size: 13px; color: var(--band-ink-2); background: var(--band-chip); border: 1px solid rgb(255 255 255 / .08); padding: 3px 10px; border-radius: 999px }
.chips b { color: var(--band-ink); font-weight: 600 }

.wrap { padding-block: 22px 64px; display: grid; gap: 20px }
.wrap > * { min-width: 0 }

/* Score tiles */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-content: start; min-width: 0; box-shadow: var(--shadow) }
.tile > :not(.ring) { grid-column: 1 }
.tile .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600 }
.tile .big { font: 600 30px/1.05 var(--f-mono); font-variant-numeric: tabular-nums }
.tile .big small { font: 600 14px var(--f-body); color: var(--ink-3); margin-left: 4px }
.tile .sub { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; grid-column: 1 / -1 }
.ring { grid-column: 2; grid-row: 1 / span 2; width: 58px; height: 58px; transform: rotate(-90deg) }
.ring circle { fill: none; stroke-width: 5; }
.ring .track { stroke: var(--loss-soft) }
.ring .val { stroke: var(--win); stroke-linecap: round; stroke-dasharray: 100 }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow) }
.filters label { display: grid; gap: 3px; font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; min-width: 0 }
select, input { font: 14px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; max-width: 100% }
select:hover, input:hover { border-color: var(--accent) }
#fPlayer { border-color: var(--accent); font-weight: 600 }
input[type=search] { width: 200px }
.check { display: flex !important; align-items: center; gap: 6px; text-transform: none !important; letter-spacing: 0 !important; font-size: 14px !important; color: var(--ink-2) !important; padding-bottom: 6px }

/* Pill tabs with a sliding highlight */
.tabs { position: relative; display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.tabs button { position: relative; z-index: 1; font: 600 14px var(--f-body); color: var(--ink-2); background: none; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer }
.tabs button[aria-selected="true"] { color: var(--accent) }
.tabs button:hover { color: var(--ink) }
#tabInk { position: absolute; z-index: 0; border-radius: 10px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); pointer-events: none }
.hint { color: var(--ink-2); font-size: 14px; margin: 0; max-width: 76ch }

/* Tables */
.tablebox { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow) }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel) }
th[data-sort] { cursor: pointer; user-select: none }
th[data-sort]:hover { color: var(--ink) }
th[data-dir]::after { content: attr(data-dir); color: var(--accent); margin-left: 4px }
th.r, td.r { text-align: right }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child > td { border-bottom: 0 }
tr.row { cursor: pointer }
tr.row:hover > td { background: var(--accent-soft) }
tr.row:hover > td:first-child { box-shadow: inset 3px 0 0 var(--accent) }
tr.detail > td { background: var(--bg); padding: 14px 16px 18px }
.team { display: flex; flex-wrap: wrap; gap: 4px; }
.mon { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 2px 9px 2px 2px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap }
.mon.noimg { padding-left: 9px }
.mon .ico { width: 26px; height: 26px; border-radius: 6px; display: block; flex: none; background-repeat: no-repeat }
.mon.lead { border-color: var(--accent); color: var(--accent); font-weight: 600 }
tr.detail .mon { background: var(--panel) }
.wr { display: flex; align-items: center; gap: 8px; justify-content: flex-end; min-width: 120px }
.bar { width: 70px; height: 8px; border-radius: 4px; background: var(--loss); overflow: hidden; display: flex }
.bar i { display: block; height: 100%; background: var(--win); border-right: 2px solid var(--panel); transform-origin: left }
.bar i[style="width:0%"], .bar i[style="width:100%"] { border-right: 0 }
.pill { font: 600 12px var(--f-mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.pill.W { background: var(--win-soft); color: var(--win) }
.pill.L { background: var(--loss-soft); color: var(--loss) }
.w { color: var(--win) } .l { color: var(--loss) }
.who { font-weight: 600 }
.sub-t { width: 100%; font-size: 13px }
.sub-t td, .sub-t th { padding: 5px 8px }
.sub-t th { background: none }
.sub-h { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; margin: 0 0 6px }
.subgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px }
.subgrid > div { min-width: 0; overflow-x: auto }
.empty { padding: 28px; color: var(--ink-3); text-align: center }

/* Chart */
.chartbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 8px; position: relative; display: grid; gap: 8px; box-shadow: var(--shadow); margin-bottom: 14px }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2) }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c) }
svg text { fill: var(--ink-3); font: 11px var(--f-mono) }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); box-shadow: var(--shadow-up) }

/* Leaderboard */
.board { display: grid; gap: 16px }
.rankby { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow) }
.seg button { font: 600 13px var(--f-body); text-transform: none; letter-spacing: 0; color: var(--ink-2); background: none; border: 0; border-radius: 999px; padding: 5px 14px; cursor: pointer }
.seg button:hover { color: var(--ink) }
.seg button[aria-pressed="true"] { color: var(--panel); background: var(--accent) }

.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end }
.pod { font: inherit; color: inherit; text-align: center; cursor: pointer; display: grid; justify-items: center; gap: 6px; padding: 18px 14px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0; position: relative; overflow: hidden }
.pod::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--metal) }
.pod.t1 { --metal: linear-gradient(90deg, #a8740f, #ffe9a3, #e8b730, #a8740f); background: linear-gradient(180deg, var(--gold-tint), var(--panel) 70%); padding-top: 30px; order: 2 }
.pod.t2 { --metal: linear-gradient(90deg, #7f8b96, #ffffff, #c5ced6, #7f8b96); background: linear-gradient(180deg, var(--silver-tint), var(--panel) 70%); order: 1 }
.pod.t3 { --metal: linear-gradient(90deg, #8a4f22, #ffd2a8, #cf8a4e, #8a4f22); background: linear-gradient(180deg, var(--bronze-tint), var(--panel) 70%); order: 3 }
.pod .place { font: 700 12px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3) }
.pod .name { font: 700 clamp(16px, 2vw, 20px)/1.15 var(--f-display); overflow-wrap: anywhere }
.pod .val { font: 600 30px/1 var(--f-mono); font-variant-numeric: tabular-nums }
.pod.t1 .val { font-size: 38px }
.pod .why { font-size: 13px; color: var(--ink-2) }
.pod .team { justify-content: center; margin-top: 4px }
.pod .crown { width: 54px; height: 44px }
.pod.t1 .crown { width: 70px; height: 57px }

.crown { display: block; overflow: visible; stroke-width: 1; stroke-linejoin: round }
.crown.t1 { fill: url(#g-gold); stroke: var(--gold-edge) }
.crown.t2 { fill: url(#g-silver); stroke: var(--silver-edge) }
.crown.t3 { fill: url(#g-bronze); stroke: var(--bronze-edge) }
.crown text { fill: var(--crown-ink); stroke: none; font: 700 9px var(--f-mono) }
.rank { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; font: 600 14px var(--f-mono); color: var(--ink-2); background: var(--bg) }
.rank.none { background: none; border: 1px dashed var(--line); color: var(--ink-3) }
.crownrank .crown { width: 34px; height: 28px }
tr.top1 > td { background: var(--gold-tint) }
tr.top2 > td { background: var(--silver-tint) }
tr.top3 > td { background: var(--bronze-tint) }
th.on { color: var(--accent) }
td.on { font-weight: 600 }
tr.unranked > td { color: var(--ink-3) }
footer { color: var(--ink-3); font-size: 13px }

@media (max-width: 640px) {
  .podium { grid-template-columns: 1fr }
  .pod.t1 { order: 1 } .pod.t2 { order: 2 } .pod.t3 { order: 3 }
  .ring { width: 48px; height: 48px }
}

/* Motion: only for viewers who haven't asked for less. Every element rests visible. */
@keyframes rise { from { opacity: 0; transform: translateY(10px) } }
@keyframes grow { from { transform: scaleX(0) } }
@keyframes growUp { from { transform: scaleY(0) } }
@keyframes ringFill { from { stroke-dashoffset: 100 } }
@keyframes shimmer { 0%, 100% { filter: drop-shadow(0 0 0 transparent) brightness(1) } 50% { filter: drop-shadow(0 0 6px var(--gold-glow)) brightness(1.12) } }
@media (prefers-reduced-motion: no-preference) {
  h1, .eyebrow, .chips { animation: rise .6s cubic-bezier(.2, .7, .2, 1) both }
  .eyebrow { animation-delay: 0s } h1 { animation-delay: .06s } .chips { animation-delay: .14s }
  .strip.enter .tile { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both }
  .strip.enter .tile:nth-child(2) { animation-delay: .06s }
  .strip.enter .tile:nth-child(3) { animation-delay: .12s }
  .strip.enter .tile:nth-child(4) { animation-delay: .18s }
  .strip.enter .ring .val { animation: ringFill 1s cubic-bezier(.2, .7, .2, 1) .15s both }
  .tile, .pod, .mon { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease }
  .tile:hover, .pod:hover { transform: translateY(-3px); box-shadow: var(--shadow-up) }
  .mon:hover { transform: translateY(-1px); border-color: var(--accent) }
  #tabInk.ready { transition: left .32s cubic-bezier(.3, .8, .2, 1), top .32s cubic-bezier(.3, .8, .2, 1), width .32s cubic-bezier(.3, .8, .2, 1), height .32s }
  .tabs button, .seg button { transition: color .2s, background-color .2s }
  tr.row > td { transition: background-color .15s }
  #view.enter > * { animation: rise .35s cubic-bezier(.2, .7, .2, 1) both }
  #view.enter tbody > tr.row[style] { animation: rise .35s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 24ms + .08s) }
  #view.enter .bar i { animation: grow .7s cubic-bezier(.2, .7, .2, 1) .15s both }
  #view.enter .cb { transform-box: fill-box; transform-origin: bottom; animation: growUp .55s cubic-bezier(.2, .7, .2, 1) both }
  #view.enter .pod { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both }
  #view.enter .pod.t1 { animation-delay: .1s } #view.enter .pod.t3 { animation-delay: .18s }
  .pod .crown.t1 { animation: shimmer 3.2s ease-in-out infinite }
  tr.detail > td > * { animation: rise .3s cubic-bezier(.2, .7, .2, 1) both }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#ebbb34"/><stop offset="1" stop-color="#a8740f"/></linearGradient>
    <linearGradient id="g-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c9d1d9"/><stop offset="1" stop-color="#808c97"/></linearGradient>
    <linearGradient id="g-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd8b2"/><stop offset=".5" stop-color="#cf8a4e"/><stop offset="1" stop-color="#8a4f22"/></linearGradient>
    <symbol id="crown" viewBox="0 0 32 26">
      <path d="M3.5 9.5 L9.5 15 L16 5 L22.5 15 L28.5 9.5 L26.3 20.5 H5.7 Z"/>
      <rect x="5.2" y="21.3" width="21.6" height="3.6" rx="1.2"/>
      <circle cx="3.2" cy="8.2" r="2.1"/><circle cx="16" cy="3.2" r="2.3"/><circle cx="28.8" cy="8.2" r="2.1"/>
    </symbol>
  </defs>
</svg>

<header class="band gutter">
  <div class="inner">
    <p class="eyebrow">Summoners War · Guild Siege</p>
    <h1 id="hName">Player</h1>
    <div class="chips" id="hMeta"></div>
  </div>
</header>

<main class="gutter">
  <div class="inner wrap">
    <section class="strip" id="strip" aria-label="Summary"></section>

    <section class="filters" aria-label="Filters">
      <label for="fPlayer" id="lPlayer" hidden>Member<select id="fPlayer"></select></label>
      <label for="fFrom">From siege<select id="fFrom"></select></label>
      <label for="fTo">To siege<select id="fTo"></select></label>
      <label for="fMin">Min. battles<select id="fMin"><option>1</option><option selected>2</option><option>3</option><option>5</option><option>10</option></select></label>
      <label for="fSearch">Monster or player<input type="search" id="fSearch" placeholder="e.g. Solveig"></label>
      <label class="check" for="fLeader"><input type="checkbox" id="fLeader" checked> Leader counts</label>
    </section>

    <nav class="tabs" role="tablist" id="tabs">
      <span id="tabInk" aria-hidden="true"></span>
      <button role="tab" data-tab="board" aria-selected="false" hidden>Leaderboard</button>
      <button role="tab" data-tab="defs" aria-selected="true">Toughest defenses</button>
      <button role="tab" data-tab="teams" aria-selected="false">Offense teams</button>
      <button role="tab" data-tab="mydef" aria-selected="false">Defenses held</button>
      <button role="tab" data-tab="sieges" aria-selected="false">Siege by siege</button>
      <button role="tab" data-tab="log" aria-selected="false">All battles</button>
    </nav>

    <p class="hint" id="hint"></p>
    <div id="view"></div>

    <footer id="foot"></footer>
  </div>
</main>

<script>
const DATA = /*__SIEGE_DATA__*/null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (w, n) => n ? Math.round(100 * w / n) : 0;
const GUILD = DATA.players.length > 1;
const TABS = ["board", "defs", "teams", "mydef", "sieges", "log"];
const MOTION = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
// All monster icons live in one sprite sheet; each icon is a background offset into it.
const SPRITE = DATA.sprite || { index: {} };
const ICON_PX = 26;
if (SPRITE.uri) {
  const css = document.createElement("style");
  css.textContent = `.mon .ico { background-image: url("${SPRITE.uri}"); background-size: ${SPRITE.cols * ICON_PX}px auto }`;
  document.head.appendChild(css);
}
const S = { tab: GUILD ? "board" : "defs", sort: {}, open: null, rankBy: "wr" };
try { const t = localStorage.getItem("siegeTab"); if (TABS.includes(t) && (GUILD || t !== "board")) S.tab = t; } catch (e) {}
const hashTab = location.hash.slice(1);
if (TABS.includes(hashTab) && (GUILD || hashTab !== "board")) S.tab = hashTab;

const sieges = DATA.sieges;
const siegeIdx = Object.fromEntries(sieges.map((s, i) => [s.match, i]));
const who = () => $("#fPlayer").value;          // "" = whole guild
const isOne = () => !GUILD || !!who();
const your = () => !GUILD ? "your" : who() ? `${who()}'s` : "the guild's";

function teamKey(t) {
  const clean = t.filter(m => m && m !== "null");
  if (!$("#fLeader").checked) return [...clean].sort().join(" · ");
  return [clean[0], ...clean.slice(1).sort()].join(" · ");
}
function mon(m, lead) {
  const i = SPRITE.index[m];
  const img = i === undefined ? "" :
    `<span class="ico" aria-hidden="true" style="background-position:-${(i % SPRITE.cols) * ICON_PX}px -${Math.floor(i / SPRITE.cols) * ICON_PX}px"></span>`;
  return `<span class="mon${lead ? " lead" : ""}${img ? "" : " noimg"}"${lead ? ' title="Leader"' : ""}>${img}${esc(m)}</span>`;
}
function teamHTML(t, lead = $("#fLeader").checked) {
  const clean = t.filter(m => m && m !== "null");
  if (!clean.length) return '<span class="meta">not recorded</span>';
  const list = lead ? [clean[0], ...clean.slice(1).sort()] : [...clean].sort();
  return '<div class="team">' + list.map((m, i) => mon(m, lead && i === 0)).join("") + "</div>";
}
function wrHTML(w, l) {
  const p = pct(w, w + l);
  return `<div class="wr"><span class="num">${p}%</span><span class="bar" role="img" aria-label="${p}% wins"><i style="width:${p}%"></i></span></div>`;
}
const wl = (w, l) => `<span class="num"><span class="w">${w}</span>–<span class="l">${l}</span></span>`;
const pill = (result, defense) => `<span class="pill ${result}">${result === "W" ? "✓ " : "✕ "}${defense ? (result === "W" ? "Held" : "Broken") : (result === "W" ? "Win" : "Loss")}</span>`;
const crown = (tier, n) => `<svg class="crown t${tier}" viewBox="0 0 32 26" role="img" aria-label="Rank ${n}"><use href="#crown"/>${n ? `<text x="16" y="18.6" text-anchor="middle">${n}</text>` : ""}</svg>`;

function filtered(type, everyone = false) {
  const a = +$("#fFrom").value, b = +$("#fTo").value, q = $("#fSearch").value.trim().toLowerCase(), p = who();
  return DATA.battles.filter(x => x.type === type && x.result !== "D" && (everyone || !p || x.player === p)).filter(x => {
    const i = siegeIdx[x.match]; if (i < a || i > b) return false;
    if (!q) return true;
    return [...x.team, ...x.oppTeam, x.opp, x.oppGuild, x.player].some(v => String(v).toLowerCase().includes(q));
  });
}

function group(list, keyFn, teamFn) {
  const m = new Map();
  for (const x of list) {
    const k = keyFn(x);
    if (!m.has(k)) m.set(k, { key: k, team: teamFn(x), w: 0, l: 0, items: [], users: new Set() });
    const g = m.get(k); g[x.result === "W" ? "w" : "l"]++; g.items.push(x); g.users.add(x.player);
  }
  return [...m.values()].map(g => ({ ...g, n: g.w + g.l, wr: pct(g.w, g.w + g.l) }));
}

function sortRows(rows, tab, def) {
  const s = S.sort[tab] || def, d = s.dir === "asc" ? 1 : -1;
  return rows.sort((a, b) => (a[s.key] > b[s.key] ? d : a[s.key] < b[s.key] ? -d : 0) || (b.l - a.l) || (b.n - a.n));
}
function th(tab, key, label, def, cls = "") {
  const s = S.sort[tab] || def;
  return `<th class="${cls}" data-sort="${key}" ${s.key === key ? `data-dir="${s.dir === "asc" ? "▲" : "▼"}"` : ""} tabindex="0">${label}</th>`;
}

function subTable(rows, label, teamCol, showUsers) {
  if (!rows.length) return `<div><p class="sub-h">${label}</p><p class="hint">None.</p></div>`;
  return `<div><p class="sub-h">${label}</p><table class="sub-t"><thead><tr><th>${teamCol}</th>${showUsers ? "<th>Used by</th>" : ""}<th class="r">W–L</th><th class="r">Win %</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${teamHTML(r.team)}</td>${showUsers ? `<td class="meta">${[...r.users].map(esc).join(", ")}</td>` : ""}<td class="r">${wl(r.w, r.l)}</td><td class="r">${wrHTML(r.w, r.l)}</td></tr>`).join("") + "</tbody></table></div>";
}
function battleList(items, defense) {
  return `<div><p class="sub-h">Battles</p><table class="sub-t"><tbody>` + items.slice().reverse().map(x =>
    `<tr><td class="num">${x.date.slice(0, 10)}</td>${isOne() ? "" : `<td class="who">${esc(x.player)}</td>`}<td>${esc(x.opp)}<br><span class="meta">${esc(x.oppGuild)}</span></td><td class="r">${pill(x.result, defense)}</td></tr>`).join("") + "</tbody></table></div>";
}

// Leaderboard rankings: the column each one sorts by, and for percentages, the count a member needs enough of.
const RANK_BY = {
  wr: { label: "Win %", col: "wr", qualify: "attacks", count: "n" },
  w: { label: "Attack wins", col: "w", count: "n" },
  hr: { label: "Hold %", col: "hr", qualify: "defense battles", count: "dn" },
  dw: { label: "Defense holds", col: "dw", count: "dn" },
};

function boardRows() {
  const off = filtered("offense", true), dfn = filtered("defense", true), m = RANK_BY[S.rankBy];
  const rows = DATA.players.map(p => {
    const o = off.filter(x => x.player === p), d = dfn.filter(x => x.player === p);
    const w = o.filter(x => x.result === "W").length, dw = d.filter(x => x.result === "W").length;
    const fav = group(o, x => teamKey(x.team), x => x.team).sort((a, b) => b.n - a.n)[0];
    return { key: p, n: o.length, w, l: o.length - w, wr: pct(w, o.length), dn: d.length, dw, dl: d.length - dw, hr: pct(dw, d.length), fav };
  });
  // A percentage needs a minimum sample: half the median count among members who played at all,
  // capped at 30 so long date ranges don't shut out members who joined later.
  let need = 1;
  if (m.qualify) {
    const counts = rows.map(r => r[m.count]).filter(Boolean).sort((a, b) => a - b);
    if (counts.length) need = Math.min(30, Math.max(1, Math.round(counts[Math.floor(counts.length / 2)] / 2)));
  }
  const ranked = r => r[m.count] >= need && (m.qualify ? true : r[m.col] > 0);
  // Rank percentages by the exact rate, not the rounded one; ties go to whoever has more battles.
  const value = r => m.col === "wr" ? (r.n ? r.w / r.n : 0) : m.col === "hr" ? (r.dn ? r.dw / r.dn : 0) : r[m.col];
  rows.sort((a, b) => (ranked(b) - ranked(a)) || (value(b) - value(a)) || (b[m.count] - a[m.count]) || a.key.localeCompare(b.key));
  let place = 0;
  rows.forEach((r, i) => {
    if (!ranked(r)) { r.rank = 0; return; }
    if (i === 0 || value(r) !== value(rows[i - 1])) place = i + 1;
    r.rank = place;
  });
  return { rows, need };
}

function podium(rows) {
  const top = rows.filter(r => r.rank && r.rank <= 3).slice(0, 3);
  if (!top.length) return "";
  const m = S.rankBy;
  const shown = r => ({
    wr: [`${r.wr}%`, `${r.w}–${r.l} in ${r.n} attacks`],
    w: [`${r.w}`, `attack wins · ${r.wr}% win rate`],
    hr: [`${r.hr}%`, `${r.dw} held of ${r.dn} attacked`],
    dw: [`${r.dw}`, `defense holds · ${r.hr}% held`],
  })[m];
  const places = ["1st", "2nd", "3rd"];
  return '<div class="podium">' + top.map(r => {
    const [val, why] = shown(r);
    return `<button type="button" class="pod t${r.rank}" data-player="${esc(r.key)}">${crown(r.rank)}` +
      `<span class="place">${places[r.rank - 1]} place</span><span class="name">${esc(r.key)}</span>` +
      `<span class="val">${val}</span><span class="why">${why}</span>${r.fav ? teamHTML(r.fav.team) : ""}</button>`;
  }).join("") + "</div>";
}

const VIEWS = {

      const m = RANK_BY[S.rankBy];

        (m.qualify ? ` To be ranked, a member needs at least ${boardRows().need} ${m.qualify} (half the guild's typical number, at most 30), so a few lucky battles can't top the table.` : "") +
        " Click a member to open their breakdown.";
    },
    render() {

        rows.map(r => `<tr class="row${r.rank ? (r.rank <= 3 ? " top" + r.rank : "") : " unranked"}" data-player="${esc(r.key)}"><td>${rank(r)}</td><td class="who">${esc(r.key)}</td>` +

          cell("dw", `<span class="num">${r.dw}</span>`) + cell("dn", `<span class="num">${r.dn}</span>`) +
          cell("hr", r.dn ? wrHTML(r.dw, r.dl) : '<span class="meta">—</span>') +
          `<td>${r.fav ? teamHTML(r.fav.team) + ` <span class="meta num">${r.fav.w}–${r.fav.l}</span>` : '<span class="meta">no attacks</span>'}</td></tr>`).join("") +
        "</tbody></table></div></div>";

  defs: {
    label: () => isOne() ? `${who() || DATA.players[0]} struggles with` : "Toughest defenses",

    render() {
      const min = +$("#fMin").value, def = { key: "l", dir: "desc" };
      const rows = sortRows(group(filtered("offense"), x => teamKey(x.oppTeam), x => x.oppTeam).filter(r => r.n >= min), "defs", def);
      if (!rows.length) return '<div class="tablebox"><p class="empty">No defenses match these filters. Try lowering "Min. battles".</p></div>';
      return `<div class="tablebox"><table><thead><tr>${th("defs", "key", "Enemy defense", def)}${th("defs", "n", "Faced", def, "r")}${th("defs", "l", "Losses", def, "r")}${th("defs", "w", "Wins", def, "r")}${th("defs", "wr", "Win %", def, "r")}<th>Best answer</th></tr></thead><tbody>` +
        rows.map(r => {
          const mine = group(r.items, x => teamKey(x.team), x => x.team).sort((a, b) => b.w - a.w || a.l - b.l);
          const best = mine.find(m => m.w > 0);
          const open = S.open === "defs:" + r.key;

        }).join("") + "</tbody></table></div>";

  },
  teams: {

    hint: () => `Win rate of each offense team in ${your()} attacks. Click a row to see which defenses it beat and lost to. A highlighted monster is the leader.`,
    render() {
      const min = +$("#fMin").value, def = { key: "n", dir: "desc" };
      const rows = sortRows(group(filtered("offense"), x => teamKey(x.team), x => x.team).filter(r => r.n >= min), "teams", def);
      if (!rows.length) return '<div class="tablebox"><p class="empty">No teams match these filters. Try lowering "Min. battles".</p></div>';
      const users = !isOne();
      return `<div class="tablebox"><table><thead><tr>${th("teams", "key", "Team", def)}${users ? "<th>Used by</th>" : ""}${th("teams", "n", "Attacks", def, "r")}${th("teams", "w", "Wins", def, "r")}${th("teams", "l", "Losses", def, "r")}${th("teams", "wr", "Win %", def, "r")}</tr></thead><tbody>` +
        rows.map(r => {
          const open = S.open === "teams:" + r.key;
          const vs = group(r.items, x => teamKey(x.oppTeam), x => x.oppTeam);
          return `<tr class="row" data-open="teams:${esc(r.key)}" aria-expanded="${open}"><td>${teamHTML(r.team)}</td>${users ? `<td class="meta">${[...r.users].map(esc).join(", ")}</td>` : ""}<td class="r num">${r.n}</td><td class="r num w">${r.w}</td><td class="r num l">${r.l}</td><td class="r">${wrHTML(r.w, r.l)}</td></tr>` +
            (open ? `<tr class="detail"><td colspan="${users ? 6 : 5}"><div class="subgrid">${subTable(vs.filter(v => v.l).sort((a, b) => b.l - a.l), "Lost to", "Enemy defense")}${subTable(vs.filter(v => v.w).sort((a, b) => b.w - a.w), "Beat", "Enemy defense")}</div></td></tr>` : "");
        }).join("") + "</tbody></table></div>";

  },
  mydef: {

    hint: () => `How often ${your()} siege defenses held when attacked. SWGT only records the attacker's name for these, not their team.`,
    render() {
      const def = { key: "n", dir: "desc" }, users = !isOne();
      const rows = sortRows(group(filtered("defense"), x => teamKey(x.team), x => x.team), "mydef", def);

      return `<div class="tablebox"><table><thead><tr>${th("mydef", "key", "Defense", def)}${users ? "<th>Owner</th>" : ""}${th("mydef", "n", "Attacked", def, "r")}${th("mydef", "w", "Held", def, "r")}${th("mydef", "l", "Broken", def, "r")}${th("mydef", "wr", "Hold %", def, "r")}</tr></thead><tbody>` +
        rows.map(r => {
          const open = S.open === "mydef:" + r.key;
          return `<tr class="row" data-open="mydef:${esc(r.key)}" aria-expanded="${open}"><td>${teamHTML(r.team)}</td>${users ? `<td class="meta">${[...r.users].map(esc).join(", ")}</td>` : ""}<td class="r num">${r.n}</td><td class="r num w">${r.w}</td><td class="r num l">${r.l}</td><td class="r">${wrHTML(r.w, r.l)}</td></tr>` +
            (open ? `<tr class="detail"><td colspan="${users ? 6 : 5}"><div class="subgrid">${battleList(r.items, true)}</div></td></tr>` : "");
        }).join("") + "</tbody></table></div>";
    }
  },
  sieges: {
    label: () => "Siege by siege",
    hint: () => `Results of ${your()} attacks in each siege. Hover a bar for the score.`,
    render() {
      const a = +$("#fFrom").value, b = +$("#fTo").value;
      const off = filtered("offense"), dfn = filtered("defense");
      const rows = sieges.slice(a, b + 1).map(s => {
        const o = off.filter(x => x.match === s.match), d = dfn.filter(x => x.match === s.match);
        const w = o.filter(x => x.result === "W").length, dw = d.filter(x => x.result === "W").length;
        return { ...s, w, l: o.length - w, dw, dl: d.length - dw };
      });
      return chart(rows) + `<div class="tablebox"><table><thead><tr><th>Date</th><th>Opponents</th><th class="r">Attacks W–L</th><th class="r">Win %</th><th class="r">Defense held–broken</th></tr></thead><tbody>` +
        rows.slice().reverse().map(r => `<tr><td class="num">${r.date}</td><td>${r.opponents.map(esc).join(" · ")}</td><td class="r">${r.w + r.l ? wl(r.w, r.l) : '<span class="meta">no attacks</span>'}</td><td class="r">${r.w + r.l ? wrHTML(r.w, r.l) : ""}</td><td class="r">${r.dw + r.dl ? wl(r.dw, r.dl) : '<span class="meta">—</span>'}</td></tr>`).join("") + "</tbody></table></div>";
    }
  },
  log: {
    label: () => "All battles",
    hint: () => "Every attack and defense battle in the selected range, newest first.",
    render() {
      const all = [...filtered("offense"), ...filtered("defense")].sort((x, y) => y.ts - x.ts);
      if (!all.length) return '<div class="tablebox"><p class="empty">No battles match these filters.</p></div>';
      const shown = all.slice(0, 600), users = !isOne();
      return `<div class="tablebox"><table><thead><tr><th>Date</th>${users ? "<th>Member</th>" : ""}<th>Type</th><th>Team</th><th>Opponent</th><th>Their team</th><th class="r">Result</th></tr></thead><tbody>` +
        shown.map(x => `<tr><td class="num">${x.date}</td>${users ? `<td class="who">${esc(x.player)}</td>` : ""}<td>${x.type === "offense" ? "Attack" : "Defense"}</td><td>${teamHTML(x.team)}</td><td>${esc(x.opp)}<br><span class="meta">${esc(x.oppGuild)}</span></td><td>${teamHTML(x.oppTeam)}</td><td class="r">${pill(x.result, x.type === "defense")}</td></tr>`).join("") +

};

function chart(rows) {
  const H = 190, padL = 28, padB = 26, padT = 10, bw = 22, gap = 10;
  const W = Math.max(320, padL + rows.length * (bw + gap) + 8);
  const max = Math.max(4, ...rows.map(r => r.w + r.l));
  const step = max > 40 ? 20 : max > 16 ? 10 : max > 8 ? 4 : 2, top = Math.ceil(max / step) * step;
  const y = v => padT + (H - padT - padB) * (1 - v / top);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  rows.forEach((r, i) => {
    const x = padL + 8 + i * (bw + gap), base = y(0), yw = y(r.w), yl = y(r.w + r.l), delay = `style="animation-delay:${(i * 18 + 80)}ms"`;
    if (r.w) g += `<rect class="cb" ${delay} x="${x}" y="${yw}" width="${bw}" height="${Math.max(0, base - yw)}" rx="3" fill="var(--win)"/>`;
    if (r.l) g += `<rect class="cb" ${delay} x="${x}" y="${yl}" width="${bw}" height="${Math.max(0, yw - yl - (r.w ? 2 : 0))}" rx="3" fill="var(--loss)"/>`;
    if (i % Math.ceil(rows.length / 8) === 0) g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${r.date.slice(5)}</text>`;
    g += `<rect class="hit" x="${x - gap / 2}" y="${padT}" width="${bw + gap}" height="${H - padT - padB}" fill="transparent" data-tip="${esc(r.date)} · ${esc(r.opponents.join(" / "))}: ${r.w}W–${r.l}L"/>`;
  });
  return `<div class="chartbox"><div class="legend"><span style="--c:var(--win)">Wins</span><span style="--c:var(--loss)">Losses</span></div><div style="overflow-x:auto"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Attack wins and losses per siege">${g}</svg></div><div class="tip" hidden></div></div>`;
}

function ring(p) {
  return `<svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="track" cx="20" cy="20" r="16"/><circle class="val" cx="20" cy="20" r="16" pathLength="100" style="stroke-dashoffset:${100 - p}"/></svg>`;
}

function strip() {
  const off = filtered("offense"), dfn = filtered("defense");
  const w = off.filter(x => x.result === "W").length, dw = dfn.filter(x => x.result === "W").length;
  const defs = group(off, x => teamKey(x.oppTeam), x => x.oppTeam).sort((a, b) => b.l - a.l || a.wr - b.wr)[0];
  const minN = isOne() ? 4 : 10;
  const teams = group(off, x => teamKey(x.team), x => x.team).filter(t => t.n >= minN).sort((a, b) => b.wr - a.wr || b.n - a.n)[0];
  const big = (n, suffix = "") => `<span class="big"><span data-to="${n}">${n}</span>${suffix.startsWith(" ") ? `<small>${suffix}</small>` : suffix}</span>`;
  const tile = (lbl, value, sub, gauge = "") => `<div class="tile"><span class="lbl">${lbl}</span>${value}${gauge}<span class="sub">${sub}</span></div>`;
  const ap = pct(w, off.length), hp = pct(dw, dfn.length);
  $("#strip").innerHTML =
    tile("Attack win rate", off.length ? big(ap, "%") : '<span class="big">—</span>', `${w} wins, ${off.length - w} losses`, off.length ? ring(ap) : "") +
    tile("Defense held", dfn.length ? big(hp, "%") : '<span class="big">—</span>', `${dw} held, ${dfn.length - dw} broken`, dfn.length ? ring(hp) : "") +
    tile("Hardest defense", defs ? big(defs.l, " losses") : '<span class="big">—</span>', defs ? teamHTML(defs.team) : "") +
    tile(`Best team (${minN}+ attacks)`, teams ? big(teams.wr, "%") : '<span class="big">—</span>', teams ? teamHTML(teams.team) + ` <span class="num">${teams.w}–${teams.l}</span>` : "");
}

// Counts each number up from 0. The final value is already in the page, so nothing depends on this running.
function countUp(root) {
  if (!MOTION || !window.requestAnimationFrame) return;
  root.querySelectorAll("[data-to]").forEach(el => {
    const to = +el.dataset.to, t0 = performance.now(), dur = 900;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), eased = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(to * eased);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function replay(el, on) {
  el.classList.remove("enter");
  if (on && MOTION) { void el.offsetWidth; el.classList.add("enter"); }
}

function moveInk() {
  const b = $('#tabs button[aria-selected="true"]'), ink = $("#tabInk");
  if (!b || b.hidden) return;
  ink.style.left = b.offsetLeft + "px"; ink.style.top = b.offsetTop + "px";
  ink.style.width = b.offsetWidth + "px"; ink.style.height = b.offsetHeight + "px";
}

// animate = true when the view changes (first load, new tab, new ranking, new member); filters and typing don't replay motion.
function render(animate = false) {
  if (S.tab === "board" && !GUILD) S.tab = "defs";
  $("#hName").textContent = GUILD ? (who() || DATA.guild) : DATA.players[0];
  strip();
  replay($("#strip"), animate);
  if (animate) countUp($("#strip"));
  document.querySelectorAll("#tabs button").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.tab === S.tab);
    b.textContent = VIEWS[b.dataset.tab].label();
  });
  moveInk();
  $("#hint").textContent = VIEWS[S.tab].hint();
  const view = $("#view");
  view.innerHTML = VIEWS[S.tab].render();
  if (animate) [...view.querySelectorAll("tbody > tr.row")].slice(0, 12).forEach((tr, i) => tr.style.setProperty("--i", i));
  replay(view, animate);
}

function init() {
  const days = /^\d+$/.test(DATA.range) ? `last ${DATA.range} days` : DATA.range;
  const chip = (b, t = "") => `<span><b>${esc(b)}</b>${t ? " " + esc(t) : ""}</span>`;
  $("#hMeta").innerHTML = (GUILD ? chip(DATA.players.length, "members") : chip(DATA.guild)) +
    (GUILD ? chip(DATA.guild) : "") + chip(sieges.length, "sieges") + chip(days) + chip("SWGT", `data, ${DATA.generated}`);
  $("#foot").textContent = `Generated ${DATA.generated} by ${GUILD ? "fetch_guild.py" : "fetch_siege.py"}. Win rates count wins and losses only.`;
  if (GUILD) {
    $("#lPlayer").hidden = false;
    $("#tabs [data-tab=board]").hidden = false;
    $("#fPlayer").innerHTML = '<option value="">Whole guild</option>' +
      [...DATA.players].sort((a, b) => a.localeCompare(b)).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  } else {
    $("#fPlayer").innerHTML = `<option value="">${esc(DATA.players[0])}</option>`;
  }
  const opts = sieges.map((s, i) => `<option value="${i}">${s.date} · ${esc(s.opponents.join(" / ") || s.match)}</option>`).join("");
  $("#fFrom").innerHTML = opts; $("#fTo").innerHTML = opts;
  $("#fFrom").value = 0; $("#fTo").value = sieges.length - 1;

  $("#fPlayer").addEventListener("change", () => { S.open = null; render(true); });
  ["#fFrom", "#fTo", "#fMin", "#fLeader"].forEach(id => $(id).addEventListener("change", () => { S.open = null; render(); }));
  $("#fSearch").addEventListener("input", () => render());
  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    S.tab = b.dataset.tab; S.open = null;
    try { localStorage.setItem("siegeTab", S.tab); } catch (err) {}
    render(true);
  });
  $("#view").addEventListener("click", e => {
    const h = e.target.closest("th[data-sort]");
    if (h) {
      const cur = S.sort[S.tab] || {}, key = h.dataset.sort;
      S.sort[S.tab] = { key, dir: cur.key === key && cur.dir === "desc" ? "asc" : "desc" };
      return render();
    }
    const rb = e.target.closest("button[data-rank]");
    if (rb) { S.rankBy = rb.dataset.rank; return render(true); }
    const p = e.target.closest("[data-player]");
    if (p) { $("#fPlayer").value = p.dataset.player; S.tab = "defs"; S.open = null; window.scrollTo({ top: 0, behavior: MOTION ? "smooth" : "auto" }); return render(true); }
    const r = e.target.closest("tr.row");
    if (r) { S.open = S.open === r.dataset.open ? null : r.dataset.open; render(); }
  });
  $("#view").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("th[data-sort]")) { e.preventDefault(); e.target.click(); } });
  $("#view").addEventListener("mousemove", e => {
    const tip = $("#view .tip"); if (!tip) return;
    const hit = e.target.closest(".hit");
    if (!hit) { tip.hidden = true; return; }
    const box = tip.parentElement.getBoundingClientRect();
    tip.textContent = hit.dataset.tip; tip.hidden = false;
    tip.style.left = (e.clientX - box.left) + "px"; tip.style.top = (e.clientY - box.top - 10) + "px";
  });
  window.addEventListener("resize", moveInk);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInk);
  render(true);
  // Turn on the tab highlight's slide only after it's in place, so it doesn't fly in from the corner.
  requestAnimationFrame(() => $("#tabInk").classList.add("ready"));
}
init();
</script>
